name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

env:
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  verify:
    name: Release preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Require an annotated tag at this commit
        shell: bash
        run: |
          set -euo pipefail
          release_ref="refs/release-check/tags/${RELEASE_TAG}"
          git fetch --no-tags origin "refs/tags/${RELEASE_TAG}:${release_ref}"
          test "$(git cat-file -t "$release_ref")" = tag
          release_commit="$(git rev-parse "${release_ref}^{commit}")"
          test "$release_commit" = "$(git rev-parse HEAD)"

      - name: Require every distribution to use the shared version source
        run: python scripts/release.py verify-source --tag "$RELEASE_TAG"

      - name: Require successful CI for this commit on main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          payload="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&per_page=100")"
          run_id="$(PAYLOAD="$payload" python - <<'PY'
          import json
          import os

          runs = json.loads(os.environ["PAYLOAD"]).get("workflow_runs", [])
          candidates = [
              run
              for run in runs
              if run.get("name") == "CI"
              and run.get("head_sha") == os.environ["GITHUB_SHA"]
              and run.get("head_branch") == "main"
              and run.get("status") == "completed"
              and run.get("conclusion") == "success"
              and run.get("event") in {"push", "workflow_dispatch"}
          ]
          candidates.sort(key=lambda run: run.get("updated_at", ""), reverse=True)
          print(candidates[0].get("id", "") if candidates else "")
          PY
          )"
          test -n "$run_id"
          echo "Using successful main CI run ${run_id} for ${GITHUB_SHA}"

  build:
    name: Build all six distributions
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Build wheels and source distributions at the tag version
        shell: bash
        run: |
          set -euo pipefail
          release_version="${RELEASE_TAG#v}"
          export SETUPTOOLS_SCM_PRETEND_VERSION="$release_version"
          python scripts/release.py prepare --tag "$RELEASE_TAG"
          mkdir -p release-bundle/distributions/{standard,standard-fastapi,standard-aws,standard-http,standard-cache,standard-rdbms}
          python -m build . --outdir release-bundle/distributions/standard
          python -m build packages/standard-fastapi --outdir release-bundle/distributions/standard-fastapi
          python -m build packages/standard-aws --outdir release-bundle/distributions/standard-aws
          python -m build packages/standard-http --outdir release-bundle/distributions/standard-http
          python -m build packages/standard-cache --outdir release-bundle/distributions/standard-cache
          python -m build packages/standard-rdbms --outdir release-bundle/distributions/standard-rdbms
          python scripts/release.py verify-artifacts \
            --tag "$RELEASE_TAG" \
            --directory release-bundle/distributions
          python -m twine check release-bundle/distributions/*/*
          (cd release-bundle && find distributions -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          (cd release-bundle && sha256sum --check SHA256SUMS)

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-package-distributions
          path: release-bundle/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish all distributions to PyPI
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: pypi
      url: https://pypi.org/project/standard/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
          path: release-bundle

      - name: Verify release checksums and stage only safe uploads
        id: pypi-check
        run: |
          cd release-bundle && sha256sum --check SHA256SUMS
          cd ..
          python scripts/release.py stage \
            --tag "$RELEASE_TAG" \
            --directory release-bundle/distributions \
            --output pypi-publish \
            --github-output "$GITHUB_OUTPUT"

      - name: Publish standard
        if: steps.pypi-check.outputs.standard_missing == 'true'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: pypi-publish/standard/

      - name: Publish standard-fastapi
        if: steps.pypi-check.outputs.standard_fastapi_missing == 'true'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: pypi-publish/standard-fastapi/

      - name: Publish standard-aws
        if: steps.pypi-check.outputs.standard_aws_missing == 'true'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: pypi-publish/standard-aws/

      - name: Publish standard-http
        if: steps.pypi-check.outputs.standard_http_missing == 'true'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: pypi-publish/standard-http/

      - name: Publish standard-cache
        if: steps.pypi-check.outputs.standard_cache_missing == 'true'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: pypi-publish/standard-cache/

      - name: Publish standard-rdbms
        if: steps.pypi-check.outputs.standard_rdbms_missing == 'true'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: pypi-publish/standard-rdbms/

  tag-and-release:
    name: Attest artifacts and create GitHub release
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
          path: release-bundle

      - name: Verify release bundle checksums
        run: cd release-bundle && sha256sum --check SHA256SUMS

      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release-bundle/SHA256SUMS
            release-bundle/distributions/*/*

      - name: Create GitHub release for the pushed tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          release_flags=()
          if [[ "${RELEASE_TAG#v}" =~ ([ab]|rc)[0-9]*$ ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" "${release_flags[@]}" \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --generate-notes \
            release-bundle/SHA256SUMS release-bundle/distributions/*/*
