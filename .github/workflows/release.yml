name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

env:
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  verify:
    name: Release preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Require an annotated tag at this commit
        shell: bash
        run: |
          set -euo pipefail
          release_ref="refs/release-check/tags/${RELEASE_TAG}"
          git fetch --no-tags origin "refs/tags/${RELEASE_TAG}:${release_ref}"
          test "$(git cat-file -t "$release_ref")" = tag
          release_commit="$(git rev-parse "${release_ref}^{commit}")"
          test "$release_commit" = "$(git rev-parse HEAD)"

      - name: Require tag and project version to match
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          expected_tag = f"v{version}"
          if os.environ["RELEASE_TAG"] != expected_tag:
              raise SystemExit(
                  f"Release tag {os.environ['RELEASE_TAG']!r} does not match {expected_tag!r}"
              )
          print(f"Releasing standard {version}")
          PY

      - name: Require successful CI for this commit on main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          payload="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&per_page=100")"
          run_id="$(PAYLOAD="$payload" python - <<'PY'
          import json
          import os

          runs = json.loads(os.environ["PAYLOAD"]).get("workflow_runs", [])
          candidates = [
              run
              for run in runs
              if run.get("name") == "CI"
              and run.get("head_sha") == os.environ["GITHUB_SHA"]
              and run.get("head_branch") == "main"
              and run.get("status") == "completed"
              and run.get("conclusion") == "success"
              and run.get("event") in {"push", "workflow_dispatch"}
          ]
          candidates.sort(key=lambda run: run.get("updated_at", ""), reverse=True)
          print(candidates[0].get("id", "") if candidates else "")
          PY
          )"
          test -n "$run_id"
          echo "Using successful main CI run ${run_id} for ${GITHUB_SHA}"

  build:
    name: Build and verify distributions
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Build wheel and source distribution
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Create checksummed release bundle
        shell: bash
        run: |
          set -euo pipefail
          test "$(find dist -maxdepth 1 -type f -name '*.whl' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -type f -name '*.tar.gz' | wc -l)" -eq 1
          mkdir -p release-bundle/distributions
          cp dist/*.whl dist/*.tar.gz release-bundle/distributions/
          (cd release-bundle && sha256sum distributions/* > SHA256SUMS)
          (cd release-bundle && sha256sum --check SHA256SUMS)

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-package-distributions
          path: release-bundle/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/standard/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: release-bundle

      - name: Verify release bundle checksums
        run: cd release-bundle && sha256sum --check SHA256SUMS

      - name: Stage only missing, checksum-matching PyPI files
        id: pypi-check
        env:
          PYPI_PROJECT: standard
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          version = os.environ["RELEASE_TAG"].removeprefix("v")
          project = quote(os.environ["PYPI_PROJECT"], safe="")
          endpoint = f"https://pypi.org/pypi/{project}/{quote(version, safe='')}/json"
          request = Request(
              endpoint,
              headers={
                  "Accept": "application/json",
                  "User-Agent": "standard-release-verifier/1 (+https://github.com/appunni-m/python-standard)",
              },
          )

          published = {}
          try:
              with urlopen(request, timeout=30) as response:
                  metadata = json.load(response)
          except HTTPError as error:
              if error.code != 404:
                  raise
          else:
              published = {
                  item["filename"]: item.get("digests", {}).get("sha256", "")
                  for item in metadata.get("urls", [])
              }

          distribution_dir = Path("release-bundle/distributions")
          artifacts = sorted(path for path in distribution_dir.iterdir() if path.is_file())
          if not artifacts:
              raise SystemExit("Release bundle contains no distributions")
          local = {
              path.name: hashlib.sha256(path.read_bytes()).hexdigest()
              for path in artifacts
          }

          unexpected = sorted(set(published) - set(local))
          if unexpected:
              raise SystemExit(
                  "PyPI already contains unexpected files for this version; refusing to reuse it: "
                  + ", ".join(unexpected)
              )
          conflicts = sorted(
              name for name, digest in published.items() if digest != local[name]
          )
          if conflicts:
              raise SystemExit(
                  "PyPI already contains files with different checksums for this version: "
                  + ", ".join(conflicts)
              )

          missing = [path for path in artifacts if path.name not in published]
          output_dir = Path("pypi-publish")
          output_dir.mkdir(exist_ok=True)
          for path in missing:
              shutil.copy2(path, output_dir / path.name)

          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              output.write(f"missing={'true' if missing else 'false'}\n")
          print(f"Verified {len(published)} existing file(s); {len(missing)} file(s) need publishing")
          PY

      - name: Publish through PyPI Trusted Publishing
        if: steps.pypi-check.outputs.missing == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: pypi-publish/

  tag-and-release:
    name: Attest artifacts and create GitHub release
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: release-bundle

      - name: Verify release bundle checksums
        run: cd release-bundle && sha256sum --check SHA256SUMS

      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release-bundle/SHA256SUMS
            release-bundle/distributions/*

      - name: Create GitHub release for the pushed tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          release_flags=()
          if [[ "${RELEASE_TAG#v}" =~ (a|b|rc|alpha|beta|pre|preview|dev)[0-9]*$ ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" "${release_flags[@]}" \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --generate-notes \
            release-bundle/SHA256SUMS release-bundle/distributions/*
