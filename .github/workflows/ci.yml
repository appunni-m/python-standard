name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            tox-environment: py311
          - python-version: "3.12"
            tox-environment: py312
          - python-version: "3.13"
            tox-environment: py313
          - python-version: "3.14"
            tox-environment: py314
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install tox
        run: python -m pip install 'tox>=4,<5'
      - name: Test this Python version
        run: tox run -e ${{ matrix.tox-environment }}

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install tox
        run: python -m pip install 'tox>=4,<5'
      - name: Formatting, lint, type checking, and docs build
        run: tox run -e lint,type,docs

  container-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install tox
        run: python -m pip install 'tox>=4,<5'
      - name: Build and consume wheel in Testcontainers
        env:
          STD_REQUIRE_DOCKER: "1"
        run: tox run -e e2e
