[build-system]
requires = ["hatchling>=1.27,<2", "hatch-vcs>=0.4,<1"]
build-backend = "hatchling.build"

[project]
name = "standard"
dynamic = ["version"]
description = "A predictable Python utility library with an agent-first interface"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Standard contributors" }]
keywords = [
  "configuration",
  "yaml",
  "toml",
  "pydantic",
  "logging",
  "structured-logging",
  "utilities",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
urls = { Documentation = "https://appunni-m.github.io/python-standard/", Repository = "https://github.com/appunni-m/python-standard", Changelog = "https://appunni-m.github.io/python-standard/changelog/" }
dependencies = [
  "PyYAML>=6,<7",
  "pydantic-settings>=2.6,<3",
]

[project.optional-dependencies]
fastapi = ["standard-fastapi>=0.1.1.dev0,<1"]
aws = ["standard-aws>=0.1.1.dev0,<1"]
http = ["standard-http>=0.1.1.dev0,<1"]
cache = ["standard-cache>=0.1.1.dev0,<1"]
rdbms = ["standard-rdbms>=0.1.1.dev0,<1"]

[project.scripts]
std = "std.cli:main"

[tool.hatch.build.targets.wheel]
only-include = [
  "src/std/__init__.py",
  "src/std/cli.py",
  "src/std/collections.py",
  "src/std/config",
  "src/std/files.py",
  "src/std/logging.py",
  "src/std/service.py",
  "src/std/py.typed",
]
sources = ["src"]

[tool.hatch.build.targets.wheel.force-include]
"src/std/skills/standard-idiomatic-python/SKILL.md" = "std/skills/standard-idiomatic-python/SKILL.md"

[tool.hatch.build.targets.sdist]
only-include = [
  "pyproject.toml",
  "README.md",
  "LICENSE",
  "src/std/__init__.py",
  "src/std/cli.py",
  "src/std/collections.py",
  "src/std/config",
  "src/std/files.py",
  "src/std/logging.py",
  "src/std/service.py",
  "src/std/py.typed",
  "src/std/skills/standard-idiomatic-python/SKILL.md",
]
ignore-vcs = false

[tool.hatch.version]
source = "vcs"
tag-pattern = "^v(?P<version>\\d+\\.\\d+\\.\\d+(?:(?:a|b|rc)\\d+)?)$"

[tool.hatch.version.raw-options]
search_parent_directories = true

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
  "integration: tests that exercise external integration boundaries",
  "e2e: end-to-end tests that require Docker through Testcontainers",
]

[tool.coverage.run]
branch = true
source = ["std"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90

[tool.ruff]
target-version = "py311"
line-length = 100
src = [
  "src",
  "packages/standard-fastapi/src",
  "packages/standard-aws/src",
  "packages/standard-http/src",
  "packages/standard-cache/src",
  "packages/standard-rdbms/src",
  "scripts",
  "tests",
]

[tool.ruff.lint]
# RUF100 rejects unused noqa suppressions.
select = ["E", "F", "I", "UP", "B", "SIM", "D1", "RUF100"]
# Class docs own constructor and special-method contracts; test intent is carried by names/assertions.
ignore = ["D105", "D107"]
per-file-ignores = { "tests/**/*.py" = ["D100", "D103"] }

[tool.mypy]
python_version = "3.11"
strict = true
enable_error_code = ["ignore-without-code"]
mypy_path = "src,packages/standard-fastapi/src,packages/standard-aws/src,packages/standard-http/src,packages/standard-cache/src,packages/standard-rdbms/src"
packages = ["std"]

[tool.tox]
requires = ["tox>=4,<5"]
env_list = ["py311", "py312", "py313", "py314", "lint", "type", "docs"]
skip_missing_interpreters = true

[tool.tox.env_run_base]
package = "skip"
skip_install = true
deps = [
  "-r requirements-test.txt",
  ".",
  "packages/standard-fastapi",
  "packages/standard-aws",
  "packages/standard-http",
  "packages/standard-cache",
  "packages/standard-rdbms",
]
set_env = { COVERAGE_FILE = ".coverage.{env_name}" }
commands = [["python", "-m", "coverage", "run", "-m", "pytest", "-m", "not e2e"], ["python", "-m", "coverage", "report"]]

[tool.tox.env.lint]
package = "skip"
skip_install = true
deps = ["ruff>=0.14,<1"]
commands = [["python", "-m", "ruff", "format", "--check", "src", "packages", "scripts", "tests", "benchmarks"], ["python", "-m", "ruff", "check", "src", "packages", "scripts", "tests", "benchmarks"]]

[tool.tox.env.type]
package = "skip"
skip_install = true
deps = [
  "boto3>=1.35,<2",
  "fastapi>=0.115,<1",
  "mypy>=1.18,<2",
  "pydantic-settings>=2.6,<3",
  "PyYAML>=6,<7",
  ".",
  "packages/standard-fastapi",
  "packages/standard-aws",
  "packages/standard-http",
  "packages/standard-cache",
  "packages/standard-rdbms",
  "types-PyYAML>=6,<7",
]
commands = [[
  "python",
  "-m",
  "mypy",
  "--explicit-package-bases",
  "src/std",
  "packages/standard-fastapi/src/std/fastapi",
  "packages/standard-aws/src/std/aws",
  "packages/standard-http/src/std/http",
  "packages/standard-cache/src/std/cache",
  "packages/standard-rdbms/src/std/rdbms",
  "scripts/release.py",
]]

[tool.tox.env.docs]
package = "skip"
skip_install = true
deps = ["zensical==0.0.69"]
commands = [["zensical", "build", "--clean"]]

[tool.tox.env.e2e]
package = "skip"
skip_install = true
deps = [
  "-r requirements-test.txt",
  ".",
  "packages/standard-fastapi",
  "packages/standard-aws",
  "packages/standard-http",
  "packages/standard-cache",
  "packages/standard-rdbms",
  "hatchling>=1.27,<2",
]
pass_env = ["STD_REQUIRE_DOCKER", "TESTCONTAINERS_RYUK_DISABLED", "TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE"]
commands = [["python", "-m", "pytest", "-m", "e2e", "-q"]]
