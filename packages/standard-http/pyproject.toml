[build-system]
requires = ["hatchling>=1.27,<2", "hatch-vcs>=0.4,<1"]
build-backend = "hatchling.build"

[project]
name = "standard-http"
dynamic = ["version"]
description = "Async HTTP client and authentication helpers for Standard"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Standard contributors" }]
keywords = ["httpx", "http", "async", "authentication", "standard"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = ["standard>=0.1.1.dev0,<1", "httpx>=0.27,<1"]
urls = { Documentation = "https://appunni-m.github.io/python-standard/http/", Repository = "https://github.com/appunni-m/python-standard" }

[tool.hatch.build.targets.wheel]
only-include = ["src/std/http"]
sources = ["src"]

[tool.hatch.build.targets.sdist]
only-include = ["pyproject.toml", "README.md", "LICENSE", "src/std/http"]

[tool.hatch.version]
source = "vcs"
tag-pattern = "^v(?P<version>\\d+\\.\\d+\\.\\d+(?:(?:a|b|rc)\\d+)?)$"

[tool.hatch.version.raw-options]
search_parent_directories = true
