[build-system]
requires = ["hatchling>=1.27,<2", "hatch-vcs>=0.4,<1"]
build-backend = "hatchling.build"

[project]
name = "standard-rdbms"
dynamic = ["version"]
description = "Async relational database helpers for the Standard Python library"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Standard contributors" }]
keywords = ["database", "sqlalchemy", "sqlite", "postgresql", "mysql", "standard"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "standard>=0.1.1.dev0,<1",
  "pydantic>=2.6,<3",
  "SQLAlchemy[asyncio]>=2.0,<3",
  "aiosqlite>=0.19,<1",
  "asyncpg>=0.29,<1",
  "aiomysql>=0.2,<1",
  "cryptography>=41",
]
urls = { Documentation = "https://appunni-m.github.io/python-standard/rdbms/", Repository = "https://github.com/appunni-m/python-standard" }

[tool.hatch.build.targets.wheel]
only-include = ["src/std/rdbms"]
sources = ["src"]

[tool.hatch.build.targets.sdist]
only-include = ["pyproject.toml", "README.md", "LICENSE", "src/std/rdbms"]

[tool.hatch.version]
source = "vcs"
tag-pattern = "^v(?P<version>\\d+\\.\\d+\\.\\d+(?:(?:a|b|rc)\\d+)?)$"

[tool.hatch.version.raw-options]
search_parent_directories = true
